[project]
name = "photoalbums"
version = "0.1.0"
description = "Generate print-ready photo books from a folder of photos"
readme = "README.md"
authors = [
    { name = "pietercoussement", email = "pieter.coussement@lizard.bio" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "reverse-geocoder>=1.5.1",
]

[project.scripts]
photoalbums = "photoalbums:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
